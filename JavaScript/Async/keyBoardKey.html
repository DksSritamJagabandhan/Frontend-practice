<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Key</title>
    <style>
        body {
            background-color: #212121;
            color: aliceblue;
        }

        .insert {
            margin-top: 200px;
        }

        .key {
            text-align: center;
        }
        .styled-table {
            border: 2px solid;
            border-radius: 5px;
            width: 100%;
            background-color: #a10000;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="insert">
            <div class="key">
                <h5>Press the key and watch magic!</h5>
            </div>
        </div>
    </div>
</body>
<script>
    const insert = document.querySelector('.insert')
    window.addEventListener('keydown', (e) => {
        insert.innerHTML = `
        <div class="table-container">
            <table class="styled-table">
                <tr>
                    <th>Key</th>
                    <th>KeyCode</th>
                    <th>Code</th>
                </tr>
                <tr>
                    <th>${e.key}</th>
                    <th>${e.keyCode}</th>
                    <th>${e.code}</th>
                </tr>
            <table>
        </div>
        `
    })
</script>

</html>
