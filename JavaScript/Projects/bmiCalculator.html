<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <style>
        body {
            background-color: #212121;
            color: aliceblue;
            text-align: center;
        }

        form {
            background-color: rgb(59, 60, 60);
            padding: 30pt;
        }

        .form {
            padding: 0pt 50pt;
        }
        #calculate{
            border-color: #212121;
            border-width: 2;
            border-radius: 5pt;
        }
        #calculate:hover{
            transform: scale(1.1);
            /* Slightly enlarges on hover */
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>BMI CALCULATOR</h2>
        <div class="form">
            <form action="/" name="form">
                <label>Enter Weight(in Kg):</label>
                <input type="number" id="weight">
                <br><br>
                <label>Enter Height(in cm):</label>
                <input type="number" id="height">
                <br><br>
                <input type="submit" id="calculate">
            </form>
        </div>
        <div id="result"></div>
        <div id="weight-guide">
            <h3>BMI weight guide</h3>
            <p>Under weight = Less than 18.6</p>
            <p>Normal weight = 18.6 to 24.9</p>
            <p>Over weight = Greater than 24.9</p>
        </div>
    </div>
</body>
<script>
    const form = document.querySelector('form')
    form.addEventListener('submit',function(e){
        e.preventDefault()

        const height = parseInt(document.querySelector('#height').value)
        const weight = parseInt(document.querySelector('#weight').value)
        const result = document.querySelector('#result')

        if(height === '' || height < 0 || isNaN(height)){
            result.innerHTML = `<p>Please give a valid height</p>`
        }else if(weight === '' || weight < 0 || isNaN(weight)){
            result.innerHTML = `<p>Please give a valid weight</p>`
        }else{
            const bmi = (weight / ((height*height)/10000)).toFixed(2)
            result.innerHTML = `<h3>${bmi}</h3>`
        }
    })
</script>
</html>
